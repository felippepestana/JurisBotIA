version: '3.8'

services:
  # PostgreSQL com pgvector para busca vetorial
  postgres:
    image: ankane/pgvector:latest
    container_name: jurisia_postgres
    environment:
      POSTGRES_DB: jurisia_db
      POSTGRES_USER: jurisia_user
      POSTGRES_PASSWORD: jurisia_pass_2024
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jurisia_user -d jurisia_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jurisia_network

  # Qdrant - Vector Database para embeddings
  qdrant:
    image: qdrant/qdrant:latest
    container_name: jurisia_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jurisia_network

  # Redis para cache e filas
  redis:
    image: redis:7-alpine
    container_name: jurisia_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass jurisia_redis_2024
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jurisia_network

  # Celery Worker para tarefas assíncronas (scraping, processamento)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jurisia_celery_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://jurisia_user:jurisia_pass_2024@postgres:5432/jurisia_db
      - REDIS_URL=redis://:jurisia_redis_2024@redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - celery_logs:/var/log/celery
    networks:
      - jurisia_network
    restart: unless-stopped

  # Celery Beat para tarefas agendadas (scraping diário)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jurisia_celery_beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://jurisia_user:jurisia_pass_2024@postgres:5432/jurisia_db
      - REDIS_URL=redis://:jurisia_redis_2024@redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    networks:
      - jurisia_network
    restart: unless-stopped

  # FastAPI Backend (opcional - para rodar via docker)
  # Descomente se quiser rodar tudo via docker
  # api:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: jurisia_api
  #   command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - DATABASE_URL=postgresql://jurisia_user:jurisia_pass_2024@postgres:5432/jurisia_db
  #     - REDIS_URL=redis://:jurisia_redis_2024@redis:6379/0
