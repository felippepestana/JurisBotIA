# Docker Compose - Produção
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: jurisia-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-juris_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      POSTGRES_DB: ${POSTGRES_DB:-juris_ia_pro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juris_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - jurisia-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: jurisia-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change_this_redis_pass}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - jurisia-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: jurisia-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - jurisia-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jurisia-backend
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-juris_user}:${POSTGRES_PASSWORD:-change_this_password}@postgres:5432/${POSTGRES_DB:-juris_ia_pro}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_this_redis_pass}@redis:6379/0
      
      # Qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: juris_documents
      
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: gpt-4-turbo-preview
      OPENAI_EMBEDDING_MODEL: text-embedding-3-large
      
      # App
      APP_ENV: production
      APP_NAME: JurisIA Pro
      APP_VERSION: 1.0.0
      DEBUG: false
      LOG_LEVEL: INFO
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-change_this_secret_key_to_something_very_secure}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://yourdomain.com}
      
      # Performance
      CACHE_TTL_SECONDS: 300
      RAG_SIMILARITY_THRESHOLD: 0.7
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - jurisia-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_PREFIX: /api/v1
    container_name: jurisia-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
      NEXT_PUBLIC_APP_NAME: JurisIA Pro
      NEXT_PUBLIC_APP_VERSION: 1.0.0
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - jurisia-network

  # Nginx Reverse Proxy (opcional, mas recomendado)
  nginx:
    image: nginx:alpine
    container_name: jurisia-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - jurisia-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  jurisia-network:
    driver: bridge
